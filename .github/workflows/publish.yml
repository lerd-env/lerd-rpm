name: Publish to COPR

on:
  schedule:
    # Daily at 09:45 UTC, a little after the deb publisher.
    - cron: "45 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-copr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict manual runs to repo admins
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/collaborators/${ACTOR}/permission" \
            | jq -r '.permission // "unknown"')
          echo "actor ${ACTOR} has permission: ${permission}"
          if [ "$permission" != "admin" ]; then
            echo "::error::Only repo admins can run this workflow manually."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          pipx install copr-cli

      - name: Check for a newer lerd release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag=$(curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/lerd-env/lerd/releases/latest \
            | jq -r .tag_name)
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then
            echo "::error::Could not resolve the latest lerd release tag."
            exit 1
          fi
          latest_version="${latest_tag#v}"
          current_version=$(cat published-version)
          echo "current: ${current_version}, latest: ${latest_version}"
          if [ "$latest_version" = "$current_version" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "version=${latest_version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write COPR credentials
        if: steps.check.outputs.updated == 'true'
        env:
          COPR_API_CONFIG: ${{ secrets.COPR_API_CONFIG }}
        run: |
          if [ -z "$COPR_API_CONFIG" ]; then
            echo "::error::COPR_API_CONFIG secret is not set."
            exit 1
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_API_CONFIG" > ~/.config/copr
          chmod 0600 ~/.config/copr

      - name: Build and submit
        if: steps.check.outputs.updated == 'true'
        run: scripts/publish.sh "${{ steps.check.outputs.version }}"

      - name: Record published version
        if: steps.check.outputs.updated == 'true'
        run: |
          echo "${{ steps.check.outputs.version }}" > published-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-version
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "chore: publish lerd ${{ steps.check.outputs.version }} to COPR"
          git push origin "HEAD:${{ github.ref_name }}"
